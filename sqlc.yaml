# SQLC Configuration File

    version: "2"

    sql:

    ##########################################
    # # Auth Domain
    ##########################################
    
    #  sessions table
      - engine: "postgresql"
        schema: "internal/infrastructure/database/postgres/migrations/*.sql"
        queries: "internal/domain/auth/infrastructure/database/queries/sessions.sql"
        gen:
          go:
            package: "sqlc"
            out: "internal/domain/auth/infrastructure/database/repository/sqlc"
            emit_json_tags: true
            emit_prepared_queries: true
            emit_empty_slices: true
            overrides:
              - db_type: "uuid"
                go_type: "github.com/google/uuid.UUID"
              - db_type: "uuid"
                nullable: true
                go_type:
                  type: "uuid.UUID"
                  import: "github.com/google/uuid"
                  pointer: true
              - db_type: "timestamptz"
                go_type: "time.Time"
              - db_type: "timestamptz"
                nullable: true
                go_type:
                  type: "time.Time"
                  pointer: true
              - db_type: "jsonb"
                go_type: "encoding/json.RawMessage"
              - db_type: "jsonb"
                nullable: true
                go_type:
                  type: "json.RawMessage"
                  import: "encoding/json"
                  pointer: true

    ##########################################
    # # User Domain
    ##########################################
    
      #  Users table
      - engine: "postgresql"
        schema: "internal/infrastructure/database/postgres/migrations/*.sql"
        queries: "internal/domain/user/infrastructure/database/queries/users.sql"
        gen:
          go:
            package: "sqlc"
            out: "internal/domain/user/infrastructure/database/repository/sqlc"
            emit_json_tags: true
            emit_prepared_queries: true
            emit_empty_slices: true
            overrides:
              - db_type: "uuid"
                go_type: "github.com/google/uuid.UUID"
              - db_type: "uuid"
                nullable: true
                go_type:
                  type: "uuid.UUID"
                  import: "github.com/google/uuid"
                  pointer: true
              - db_type: "timestamptz"
                go_type: "time.Time"
              - db_type: "timestamptz"
                nullable: true
                go_type:
                  type: "time.Time"
                  pointer: true
              - db_type: "jsonb"
                go_type: "encoding/json.RawMessage"
              - db_type: "jsonb"
                nullable: true
                go_type:
                  type: "json.RawMessage"
                  import: "encoding/json"
                  pointer: true